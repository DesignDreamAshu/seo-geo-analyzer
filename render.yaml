services:
  - type: web
    name: seo-geo-analyzer-backend
    env: node
    rootDir: apps/backend
    buildCommand: npm install && npm run render-build
    startCommand: npm run start
    plan: free
    envVars:
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        value: "http://localhost:8080,https://dream-seo-geo.netlify.app"
      - key: GOOGLE_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "18"
